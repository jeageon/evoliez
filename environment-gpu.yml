# SERVER environment (4x RTX A6000, CUDA 12.4). Solve-friendly:
#  - channels limited to conda-forge + bioconda (+ nodefaults) -> no Anaconda
#    ToS prompt, far smaller/faster SAT problem.
#  - PyTorch is NOT a conda package here (the conda pytorch/nvidia/cudatoolkit
#    metapackages are the classic "solve bomb"). It is pip-installed from the
#    official cu121 wheels in the pip: section below.
#  - OpenMM from conda-forge already ships its own CUDA runtime; no
#    cudatoolkit pin needed.
#
#   mamba env create -f environment-gpu.yml -p /mnt/data/<you>/envs/evoliez
#   conda activate /mnt/data/<you>/envs/evoliez
#
# Boltz/LigandMPNN/DiffDock/GNINA + weights are installed separately
# (docs/DATA_AND_WEIGHTS.md, scripts/fetch_weights.sh).
#
name: evoliez
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  - pip
  # core
  - numpy
  - pandas
  - pyyaml
  - pydantic>=2.4
  - sqlalchemy>=2.0
  - networkx
  - typer
  - rich
  # science
  - rdkit
  - biopython
  - scikit-learn
  - xgboost
  # md (OpenMM conda-forge build includes the CUDA platform)
  - openmm
  - openff-toolkit
  - openmmforcefields
  - ambertools
  # repairs Boltz chain termini (OXT) / missing heavy atoms before Amber
  # parameterization; without it real MD hits "No template for residue".
  - pdbfixer
  # homology / MSA / docking
  - mafft
  - hmmer
  - mmseqs2
  - foldseek
  - blast
  - vina
  - openbabel
  - pip:
      # GPU PyTorch from official CUDA 12.1 wheels (driver 550 / CUDA 12.4
      # is backward compatible). torch_geometric is the optional GNN backend.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch
      - torch_geometric
      - -e .
