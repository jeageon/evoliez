# =====================================================================
# SrCAR (Carboxylic Acid Reductase, UniProt E5XP76) engineered to reduce
# 3-hydroxypropanoate (3-HP) -> 3-hydroxypropanal (3-HPA).
# =====================================================================
# Engineering rationale (see car/NOTES.md):
#   The 3-HP-specificity bottleneck in CAR is the N-terminal ADENYLATION (A)
#   domain, which activates the acid as an acyl-adenylate (ATP-dependent) before
#   the PCP/thioester + C-terminal reductase(NADPH) steps. 3-HP is a tiny, polar,
#   NON-native substrate; making CAR accept it is an A-domain pocket problem, not
#   a distal NADPH/R-domain problem. So we model the A-domain di-domain
#   (residues 1-720, incl. the PCP Ser702) with 3-HP (design substrate) + ATP
#   (adenylation co-substrate). NADPH/R-domain reduction is a separable
#   downstream step, out of scope for this specificity model.
#
# DATA-QUALITY NOTE: the source CSV gave 3-HP as "OCC(=O)[O-]" which RDKit reads
# as C2H3O3- (GLYCOLATE, 2 carbons). The product 3-HPA (C(CO)C=O) is 3 carbons,
# so the true substrate must be 3-hydroxyPROPanoate = OCCC(=O)[O-] (C3H5O3-).
# Corrected below.

project:
  name: srcar_3hp_prod
  objective: activity_improvement
  output_dir: /mnt/data/jglee/EvoLiEZ_car/runs/srcar_3hp_prod

input:
  target_id: srcar
  target_fasta: car/targets/srcar_Adomain.fasta   # E5XP76 residues 1-720 (A + PCP)
  ligand:
    id: 3HP
    type: smiles
    value: "OCCC(=O)[O-]"           # 3-hydroxypropanoate (CORRECTED; CSV had 2C glycolate)
    role: design_ligand             # the substrate we engineer the A-pocket to accept
    net_charge: -1
    allow_am1bcc: true              # small acid; AM1-BCC converges fine
  extra_ligands:
    - id: ATP
      type: smiles
      value: "Nc1ncnc2n(cnc12)[C@@H]1O[C@H](COP(=O)([O-])OP(=O)([O-])OP(=O)([O-])[O-])[C@@H](O)[C@H]1O"
      role: cofactor                # adenylation co-substrate; anchors the A-site + alpha-P
      net_charge: -4
      allow_am1bcc: false           # triphosphate won't converge in sqm (pre-derived charges pre-s10)
  # A3 phosphate-binding loop of the adenylation domain (TSGSTGTPKG @ 265-274):
  # the ATP-phosphate-coordinating catalytic machinery. Protected from mutation;
  # the 3-HP acid pocket to redesign is discovered by the 8 A design radius.
  catalytic_residues: ["S268", "T269", "K273"]
  fixed_residues: ["S268", "T269", "K273"]
  cofactor: ATP
  ec_number: "1.2.1.30"

homologs:
  method: mmseqs2
  database: /mnt/data/jglee/evoliez_db/uniref30_2302_seqdb    # real local homolog mining
  max_sequences: 20000

msa:
  method: mafft
  compute_conservation: true
  compute_pssm: true

complex_prediction:
  primary_method: boltz2
  use_msa_server: true              # Boltz fetches a real structural MSA (network verified)
  representative_homologs: 80
  diffusion_samples: 25             # target-complex ensemble

interaction_model:
  enabled: true
  representative_homologs: auto     # size from MSA subfamilies (clamped below)
  representative_coverage: 0.90
  representative_min: 40
  representative_max: 48            # tractable on 2 free GPUs (~2.4h); robust family model
  poses_per_homolog: 12
  contact_cutoff: 6.0
  k_nearest_residues: 8
  model: xgboost

gnn:
  enabled: false                    # no CAR-family checkpoint; avoid a mistrained prior

mutation_generation:
  methods: [chemistry_rules, msa_sampler, ligandmpnn]
  max_candidates: 8000
  design_radius_angstrom: 8.0

reranking:
  model: xgboost
  use_experimental_labels: false
  top_for_redocking: 400
  top_for_md: 24
  mutant_boltz_enabled: true
  mutant_boltz_top_n: 24
  mutant_boltz_diffusion_samples: 5

validation:
  redocking:
    methods: [gnina, diffdock]
  stability:
    method: thermompnn
    max_ddg_allowed: 2.5
  md:
    enabled: true
    engine: openmm
    protocol_level: 2               # screening tier for the first pass (raise to 3 for paper-grade)
    solvent: implicit
    production_ns: 2.0
    replicas: 3
    top_candidates: 24
    require_real_structure: true
    rbfe:
      enabled: true
      top_n: 3
      n_lambda: 9
      prod_steps: 50000
      multipoint: additive
    binding_dg:
      enabled: true
      top_n: 3
    # Adenylation NAC (3-HP carboxylate-O -> ATP alpha-P) added + verified before s10.
    reactive_geometry:
      enabled: false

scoring:
  family_interaction: 1.0

selection_lanes:
  enabled: true
  from_ml_high: 25
  from_stability_high: 12
  from_geometry_high: 12
  from_diversity: 8
  low_ml_controls: 8

compute:
  cpu_core_budget: 16               # shared-server watchdog safe (<=16-24 cores)
  gpu_pool: []                      # inherit CUDA_VISIBLE_DEVICES (set per-launch; free GPUs only)
  fail_loud_on_cpu_md: true

output:
  final_library_size: 96
  top_single_mutants: 50
  report_format: [markdown, csv, pymol_session]

backend: real
backends: {}
allow_mock_fallback: false          # quality-first: a failed real tool HARD-FAILS (no silent mock)
seed: 1234
