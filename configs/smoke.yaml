# Tiny config for staged server smoke (scripts/server_smoke.sh). Minimal
# scale so each step finishes in seconds-to-minutes, not hours. Real-run
# scale lives in configs/server_fdh_nadp.yaml. server_smoke.sh flips one
# stage to real per step; output_dir is overridden by the script.

project:
  name: fdh_smoke
  objective: cofactor_switching
  output_dir: runs/smoke

input:
  target_id: fdh
  target_fasta: examples/fdh/target.fasta
  ligand:
    # Resolved by evoliez.features.cofactors from (cofactor, target_ph,
    # cofactor_redox). Smoke runs the SAME species as the server config so
    # 'smoke passed, server broke' on the ligand can't happen; flip
    # cofactor_redox below or override with type='smiles' for variants.
    id: NADP_cofactor
    type: cofactor
    value: NADP
  # NOTE: examples/fdh/target.fasta is an ILLUSTRATIVE placeholder. These
  # tokens are chosen to be self-consistent with that sequence (His@154,
  # Arg@285, Gly@15/33) so the wiring smoke is clean - they are NOT a
  # verified FDH active site. A real run needs the real target + numbering;
  # `evoliez doctor` BLOCKs a real backend on this placeholder.
  catalytic_residues: ["H154", "R285"]
  fixed_residues: ["G15", "G33", "H154", "R285"]
  cofactor: NADP
  cofactor_redox: oxidized     # NADP+ binding/transition proxy for FDH
  target_ph: 7.4
  ec_number: "1.2.1.2"

homologs:
  method: mmseqs2
  max_sequences: 200          # synthetic in mock; small

msa:
  method: mafft
  remote_server: false        # no UniRef DB needed for smoke

complex_prediction:
  primary_method: boltz2
  diffusion_samples: 2        # tiny Boltz ensemble for the WT

interaction_model:
  enabled: true
  representative_homologs: 3  # was 80 -> 3 for smoke
  poses_per_homolog: 2        # was 15 -> 2

gnn:
  enabled: false              # GNN train is a separate smoke step
  build_dataset: true         # but still export a small graph dataset

mutation_generation:
  methods: [chemistry_rules]
  max_candidates: 40
  design_radius_angstrom: 9.0

reranking:
  model: xgboost
  use_experimental_labels: false
  top_for_redocking: 12
  top_for_md: 4
  mutant_boltz_enabled: true
  # P0 lesson: mutant_boltz_top_n MUST be >= top_for_md, else s10_md hits
  # the sequence guard ("MD input ... is the shared WT structure, not the
  # mutant") for any md_candidate that's outside s08b's top-N. Server
  # config already has 50 vs 30 (-> safe); smoke now lines up too.
  mutant_boltz_top_n: 4
  mutant_boltz_diffusion_samples: 2

validation:
  redocking:                  # DockingConfig (also used by s05_docking)
    methods: [vina]           # CPU; gnina/diffdock optional
    # Wiring smoke: only need Vina to emit an out.pdbqt for the parser, NOT
    # docking quality. NADP is huge/flexible so default exhaustiveness=8 x
    # 10 modes runs for hours - slash it; cap cores on the shared box.
    poses_per_candidate: 3
    exhaustiveness: 1
    cpu: 4
    timeout_s: 900
  stability:
    method: ml                # FoldX/Rosetta optional; ml proxy for smoke
  md:
    enabled: true
    protocol_level: 0         # minimise-only = fastest MD smoke
    top_candidates: 4

output:
  final_library_size: 24
  report_format: [markdown, csv]

backend: mock                 # server_smoke.sh flips one stage to real
seed: 1234
