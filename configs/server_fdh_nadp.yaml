# Server-grade config (admin1-SYS-740GP-TNRT, 4x A6000, CUDA 12.4).
# Real backends, /mnt/data2 storage, Boltz ensemble + EvoLigand-GNN.
#
#   cd /mnt/data2/<you>/EvoLiEZ
#   bash scripts/run_pipeline.sh configs/server_fdh_nadp.yaml      # build + datasets
#   evoliez train-gnn -c configs/server_fdh_nadp.yaml              # train GNN
#   evoliez run -c configs/server_fdh_nadp.yaml --from s08_reranker --resume
# or drive the whole thing with workflow/Snakefile.

project:
  name: psefdh_nad_to_nadp
  objective: cofactor_switching
  # Server doctor flagged /mnt/data2 root as not writable for the current
  # user; the smoke pipeline has been writing to /mnt/data/<user>/runs/
  # cleanly. Use that for the production output to avoid permission
  # surprises mid-run. /mnt/data2/<user>/runs is fine too if it exists.
  output_dir: /mnt/data/jglee/runs/psefdh_nad_to_nadp

input:
  # Pseudomonas sp. 101 FDH (PseFDH) - UniProt P33160 (FDH_PSESR), 401 aa.
  # Gold-standard NAD->NADP cofactor switching target (Tishkov 1999/2003,
  # Holmberg, Pollegioni). Fetched via scripts/fetch_target_fasta.sh and
  # all residue tokens BELOW come from UniProt's curated annotations:
  #   ACT_SITE / BINDING / SITE in uniprot_P33160.txt
  # (literature numbering from older PDB-based papers disagrees by a few
  # residues; we use the UniProt mature-protein 1-based numbering).
  target_id: PseFDH_P33160
  target_fasta: examples/pseudomonas_fdh/target.fasta
  ligand:
    id: NADP_cofactor
    type: cofactor
    value: NADP
  # SITE annotations marked "Important for catalytic activity" in UniProt.
  # These are NEVER mutated (catalytic) AND fixed (don't include in design).
  catalytic_residues: ["R285", "H333"]
  fixed_residues: ["R285", "H333"]
  # BINDING residues for NAD(+) from UniProt curation. Boltz uses this as
  # the `pocket_constraints` steering target so the diffusion model
  # places the cofactor in the real NAD-binding pocket. D222 is the
  # canonical NAD->NADP specificity switch target (Tishkov: D->S/H/A
  # variants shift cofactor preference); it's INTENTIONALLY NOT in
  # fixed_residues so the design generators can propose D222 mutations.
  known_binding_site:
    - "S148"
    - "R202"
    - "I203"
    - "D222"      # NADP specificity switch target (Tishkov)
    - "P257"
    - "L258"
    - "H259"
    - "P260"
    - "E261"
    - "T283"
    - "D309"
    - "H333"
    - "I334"
    - "S335"
    - "G336"
    - "S381"
  cofactor: NADP
  cofactor_redox: oxidized     # NADP+ binding/transition proxy for FDH
  target_ph: 7.4
  organism: "Pseudomonas sp. 101"
  ec_number: "1.17.1.9"          # NAD-dependent formate dehydrogenase

homologs:
  method: mmseqs2
  database: /mnt/data2/evoligand/db/uniref30_2302/uniref30_2302_db
  max_sequences: 20000

msa:
  method: mafft
  compute_conservation: true
  compute_pssm: true

complex_prediction:
  primary_method: boltz2
  use_msa_server: true
  representative_homologs: 80
  diffusion_samples: 30                 # target enzyme ensemble

interaction_model:
  enabled: true
  representative_homologs: 80
  poses_per_homolog: 15                 # Boltz samples per representative
  contact_cutoff: 6.0
  k_nearest_residues: 8
  model: xgboost

gnn:
  enabled: true                          # EvoLigand-GNN is the primary model
  build_dataset: true
  checkpoint: checkpoints/evoligand_gnn.pt
  hidden_dim: 256
  layers: 6
  radius_lr: 6.0
  radius_rr: 9.0
  lr: 0.001
  epochs: 60
  amp: true
  ddp: false                             # set true when launched via torchrun

data_scale:
  target_diffusion_samples: 30
  homolog_diffusion_samples: 15
  mutant_diffusion_samples: 10
  top_for_redocking: 500
  top_for_stability: 100
  top_for_md: 30
  final_library: 96

mutation_generation:
  # binding_site_scan added so the published Tishkov D222S/N/T/Q/H/A
  # family is guaranteed to land in the candidate pool even when the
  # homolog MSA is sparse on the cofactor-specificity loop. See
  # configs/server_fdh_nadp_cheap.yaml for the rationale.
  methods: [chemistry_rules, msa_sampler, ligandmpnn, binding_site_scan]
  max_candidates: 8000
  design_radius_angstrom: 8.0

reranking:
  model: xgboost
  use_experimental_labels: false         # set true + experimental_dataset later
  top_for_redocking: 500
  top_for_md: 30

validation:
  redocking:
    methods: [gnina, diffdock]
  stability:
    method: foldx
    max_ddg_allowed: 2.5
  md:
    enabled: true
    protocol_level: 2
    solvent: implicit
    production_ns: 2.0
    top_candidates: 30
    # P0: per-candidate subprocess isolation so OpenMM / CUDA leaks
    # are contained at the OS level. Enabled for production after
    # cheap-run validation (scripts/server_cheap_run_psefdh.sh).
    subprocess_isolation: true
    subprocess_timeout_seconds: 3600         # 1 h/candidate at production ns

scoring:
  gnn: 1.5                               # EvoLigand-GNN as a primary term
  family_interaction: 1.0

output:
  final_library_size: 96
  top_single_mutants: 50
  report_format: [markdown, csv, pymol_session]

backend: real
backends:
  # keep MD mocked during the first server smoke if desired:
  # s10_md: mock
  {}
seed: 1234
