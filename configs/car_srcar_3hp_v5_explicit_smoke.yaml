# E1 EXPLICIT BUILD SMOKE (WT + P438N, 20 ps): confirm TIP3P/PME system builds, Mg+ATP+3HP retained
# =====================================================================
# SrCAR (Carboxylic Acid Reductase, UniProt E5XP76) -> 3-HP adenylation, V5.
# =====================================================================
# ROADMAP_V5: A-domain PRIMARY (residues 1-720; full-length is context validation only),
# adenylation mechanism declared, Mg2+ modelled, the V5-1-fixed O->P near-attack angle.
#
# GEOMETRY SOURCE OF TRUTH: mechanism.geometry_terms is canonical. s10 does not yet CONSUME
# mechanism.geometry_terms (the ReactiveSpec/GeometryTerm bridge is V5-6), so the legacy
# validation.md.reactive_geometry path is kept ENABLED to actually run the (V5-1-fixed)
# O_nuc-Palpha-O_leaving angle; because mechanism is declared, s10 records
# geometry_source = "legacy_reactive_geometry_from_mechanism_spec" (honest: legacy ran,
# consistent with the declared adenylation mechanism). Flip reactive_geometry.enabled to false
# once s10 consumes mechanism.geometry_terms directly.

project:
  name: srcar_3hp_v5
  objective: activity_improvement
  output_dir: /mnt/data/jglee/EvoLiEZ_car/runs/srcar_3hp_v5_e1_smoke

input:
  target_id: srcar
  target_fasta: car/targets/srcar_Adomain.fasta   # E5XP76 residues 1-720 (A + PCP) — A-domain PRIMARY
  ligand:
    id: 3HP
    type: smiles
    value: "OCCC(=O)[O-]"           # 3-hydroxypropanoate (CORRECTED; CSV had 2C glycolate)
    role: design_ligand
    net_charge: -1
    allow_am1bcc: true
  extra_ligands:
    - id: ATP
      type: smiles
      value: "Nc1ncnc2n(cnc12)[C@@H]1O[C@H](COP(=O)([O-])OP(=O)([O-])OP(=O)([O-])[O-])[C@@H](O)[C@H]1O"
      role: cofactor                # adenylation co-substrate; the alpha-P is the electrophile
      net_charge: -4
      allow_am1bcc: false
      charges_mol2: params/atp_4minus/ATP.fixed.mol2   # pre-derived AM1-BCC (43 atoms, -4); triphosphate won't converge in sqm
  # ligand roles live HERE (input layer), NOT in the mechanism block (mechanism = reaction envelope).
  catalytic_residues: ["S268", "T269", "K273"]
  fixed_residues: ["S268", "T269", "K273"]
  cofactor: ATP
  ec_number: "1.2.1.30"

# ROADMAP_V5 V5-3 — reaction mechanism envelope (adenylation, Palpha; NOT the Pgamma
# phosphoryl_transfer stub). Selects the template (default O->P geometry terms), hard-gates the
# reaction_state, and flips the run to mechanism mode. Mg2+ is declared here as metal_state; the
# ion is placed at structure level (MG HETATM, Amber standard ion) by md/metal_placement.py
# when the MD metal setup is enabled (V5-2), never through OpenFF.
mechanism:
  reaction:
    class: adenylation_phosphoryl_transfer
  reaction_state:
    substrate_state: 3HP_carboxylate
    cofactor_state: ATP              # non-redox cofactor (distinct from cofactor_redox_state)
    metal_state: Mg2+_bridged        # bridges the 3-HP carboxylate and the ATP phosphates
    conformational_state: A_domain_closed
    protonation_model: pH7_4_manual

homologs:
  method: mmseqs2
  database: /mnt/data/jglee/evoliez_db/uniref30_2302_seqdb
  max_sequences: 20000

msa:
  method: mafft
  compute_conservation: true
  compute_pssm: true

complex_prediction:
  primary_method: boltz2
  use_msa_server: true
  representative_homologs: 80
  diffusion_samples: 25

interaction_model:
  enabled: true
  representative_homologs: 3              # E1: minimal s06b (manifest-seeded, ml_score irrelevant)
  representative_coverage: 0.90
  representative_min: 40
  representative_max: 48
  poses_per_homolog: 12
  contact_cutoff: 6.0
  k_nearest_residues: 8
  model: xgboost

gnn:
  enabled: false

mutation_generation:
  methods: [chemistry_rules, msa_sampler, ligandmpnn]
  max_candidates: 8000
  design_radius_angstrom: 8.0

reranking:
  model: xgboost
  use_experimental_labels: false
  top_for_redocking: 400
  top_for_md: 24
  mutant_boltz_enabled: true
  mutant_boltz_top_n: 24
  mutant_boltz_diffusion_samples: 5

validation:
  redocking:
    methods: [gnina, diffdock]
  stability:
    method: thermompnn
    max_ddg_allowed: 2.5
  md:
    enabled: true
    engine: openmm
    protocol_level: 1               # E1 explicit-solvent
    solvent: explicit          # E1: TIP3P + PME + Na/Cl neutralize (real, not fallback)
    production_ns: 0.02
    replicas: 1
    top_candidates: 24
    require_real_structure: true
    rbfe:
      enabled: false                 # V5 focused run: RBFE DEFERRED (reviewer) — the focused
      top_n: 3                        # question is reaction-geometry (NAC) discrimination, not
      n_lambda: 9                     # relative binding free energy. Re-enable only after the
      prod_steps: 50000              # 2 ns NAC tier passes and a lead set is worth the compute.
      multipoint: additive
    binding_dg:
      enabled: false
      top_n: 3
    # LEGACY reactive_geometry path (kept enabled until s10 consumes mechanism.geometry_terms):
    # runs the V5-1-fixed O->P near-attack angle. transfer_is_h:false -> nac.identify_leaving
    # resolves the ATP alpha-beta bridging O and computes O_nuc-Palpha-O_leaving (was NaN).
    # geometry_source is recorded as legacy_reactive_geometry_from_mechanism_spec.
    reactive_geometry:
      enabled: true
      donor_smarts: "[OX1-]"                 # 3-HP carboxylate O (nucleophile)
      acceptor_smarts: "[PX4]([OX2][CX4])"   # ATP alpha-P only (beta/gamma excluded)
      donor_idx: 0
      acceptor_idx: 0
      transfer_is_h: false                   # O attacks P (no H transfer) -> leaving-group angle
      distance_max: 3.6                      # near-attack O...Palpha (WT rests ~7.9 A -> engineering gap)
      angle_min: 150.0                       # read-only occupancy gate (no angle restraint)
      label: 3HP_carboxylate_to_ATP_alphaP
      template_cosubstrate_placement: true
      restrain_cosubstrate: true             # distance-only flat-bottom on the reactive O
      restraint_radius_A: 3.6

scoring:
  family_interaction: 1.0

selection_lanes:
  enabled: true
  from_ml_high: 25
  # NOTE (ROADMAP_V5 step 5): at s08 the stability/geometry quotas are NOT yet computable
  # (they are s09/s10 products), so s08 REPURPOSES these two slots to size the s08-computable
  # evolutionary (MSA permissiveness) and ligand-competence (interaction_gain) lanes. At
  # s08b/s09 they mean stability/geometry as usual. The actual per-stage lane->quota mapping is
  # recorded in reports/provenance/reranked_candidates.json. (Migration: a future PR splits
  # from_evolutionary_high / from_ligand_high into their own config fields.)
  from_stability_high: 12          # s08: sizes the evolutionary_high lane
  from_geometry_high: 12           # s08: sizes the ligand_competence_high lane
  from_diversity: 8
  low_ml_controls: 8

compute:
  cpu_core_budget: 16
  gpu_pool: []
  fail_loud_on_cpu_md: true

output:
  final_library_size: 96
  top_single_mutants: 50
  report_format: [markdown, csv, pymol_session]

backend: real
backends: {}
allow_mock_fallback: false
seed: 1234
