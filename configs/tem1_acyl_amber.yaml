# V6-6 — NON-CAR, NON-REDOX real-backend target: TEM-1 beta-lactamase (class A serine
# hydrolase, UniProt P62593). Reaction: catalytic Ser68 Ogamma (STFK motif; Ambler
# Ser70) attacks the beta-lactam scissile carbonyl C = nucleophilic acyl substitution
# — genuinely NON-redox, NON-metal, NON-CAR chemistry, run through the SAME V6
# Amber framework (V6-1 builder + V6-2 executor + protein-nucleophile geometry).
#
# Key difference from CAR/FDH: the nucleophile is a PROTEIN atom (Ser68 Ogamma),
# resolved from the MD topology (donor_protein), not a ligand SMARTS. The V6-1
# builder now maps it to a prmtop mask (:<resid>@OG) alongside the ligand acceptor.
#
# backend: real. Structure = a Boltz-predicted Michaelis complex (real backend);
# Amber build/MD/geometry are real (no mock). See docs/v6/nonredox_real_backend_report.md.

project:
  name: tem1_acyl_amber_nonredox
  objective: activity_improvement
  output_dir: runs/tem1_acyl_amber

input:
  target_id: tem1_blat
  target_fasta: car/targets/tem1_blat.fasta
  ligand:
    id: LIG                                   # benzylpenicillin (penicillin G), the beta-lactam substrate
    type: smiles
    value: "CC1(C)S[C@@H]2[C@H](NC(=O)Cc3ccccc3)C(=O)N2[C@H]1C(=O)O"
    role: design_ligand
    # Modeled NEUTRAL (protonated carboxylate) for parameterization consistency with
    # the Boltz-predicted pose (_ligands_at_pose extracts the neutral form). The remote
    # carboxylate protonation does not affect the Ser68->beta-lactam reaction geometry.
    net_charge: 0
    allow_am1bcc: true
  catalytic_residues: ["S68", "T69", "K71"]   # STFK catalytic Ser/Thr/Lys (match the FASTA)
  fixed_residues: ["S68", "T69", "K71"]
  ec_number: "3.5.2.6"

mechanism:
  reaction:
    class: nucleophilic_acyl_substitution     # NON-redox acyl class, same mechanism framework
  reaction_state:
    protonation_model: pH7
    conformational_state: michaelis

# Amber-native system + reactive geometry (V6-1/V6-2). No metal, no co-substrate.
amber:
  protein_ff: ff14SB
  water: tip3p
  solvent: explicit
  box_buffer_A: 12.0
  reactive_geometry:
    enabled: true
    # PROTEIN nucleophile: catalytic Ser68 Ogamma attacks the beta-lactam scissile
    # carbonyl C. donor_protein resolves the Ser Ogamma from the topology; the ligand
    # supplies the acceptor. The angle (Nuc--C=O, Burgi-Dunitz-like) is READ-ONLY.
    donor_protein: "SER:OG:68"
    # beta-lactam-SPECIFIC: the scissile carbonyl is the one in the strained 4-membered
    # ring (r4), NOT the acyclic side-chain amide. The generic [CX3](=O)[NX3] would
    # mis-select the side-chain carbonyl of benzylpenicillin.
    acceptor_smarts: "[CX3;r4](=[OX1])[NX3;r4]"
    acceptor_idx: 0
    transfer_is_h: false
    distance_max: 3.5
    angle_min: 95.0                           # Burgi-Dunitz nucleophilic addition (~105 +/- 10)
    label: ser68_ogamma_attack_on_betalactam_carbonyl

validation:
  md:
    enabled: true
    engine: amber
    solvent: explicit
    protocol_level: 3
    production_ns: 0.1
    top_candidates: 3

compute:
  gpu_pool: [0]
  fail_loud_on_cpu_md: true

backend: real
seed: 1234
