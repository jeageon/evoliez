# =====================================================================
# PRODUCTION config - real backends, REMOTE MSA, /mnt/data2 storage.
# =====================================================================
# Differs from server_fdh_nadp.yaml in ONE thing: homologs/MSA come from
# Boltz's hosted MSA server (msa.remote_server: true) instead of a local
# UniRef DB. Trade-off: the COMPLEX-prediction MSA (s04 Boltz) is REAL, but
# the EvoLiEZ homolog stage (s02/s03) and its evolutionary/subfamily features
# fall back to SYNTHETIC homologs (no local DB to mine). For real homolog
# evolutionary signal, set homologs.database to a local UniRef/BFD DB instead.
#
# BEFORE A REAL RUN you MUST set the 3 [FILL-IN] fields below. `evoliez doctor
# -c configs/prod_fdh_nadp.yaml` BLOCKs (exit 1) until:
#   - input.target_fasta points at YOUR real target (not a placeholder header)
#   - input.catalytic_residues / fixed_residues match the real sequence at
#     those positions (doctor cross-checks every token against the fasta)
#
#   evoliez doctor -c configs/prod_fdh_nadp.yaml      # must be 0 blocking
#   bash scripts/run_pipeline.sh configs/prod_fdh_nadp.yaml   # GPU auto-pinned
# Stage-by-stage: evoliez run -c configs/prod_fdh_nadp.yaml --to <stage> [--resume]

project:
  name: fdh_nadp_prod
  objective: cofactor_switching
  output_dir: /mnt/data2/<you>/runs/fdh_nadp_prod     # [FILL-IN] /mnt/data2 or /mnt/data, NEVER / or ~

input:
  target_id: fdh
  # [FILL-IN] real target FASTA on the server (single chain). doctor BLOCKs a
  # placeholder header (illustrative/example/placeholder) and a fasta whose
  # residues disagree with the tokens below.
  target_fasta: /mnt/data2/<you>/targets/fdh_real.fasta
  ligand:
    id: NADP_cofactor
    type: smiles
    # NADP+ (the cofactor being engineered away from). Replace if your ligand
    # differs; RDKit must parse it (doctor/s01 report source==rdkit, not synthetic).
    value: "NC(=O)c1ccc[n+](c1)[C@@H]1O[C@H](COP([O-])(=O)OP([O-])(=O)OC[C@H]2O[C@@H](n3cnc4c3ncnc4N)[C@H](O)[C@@H]2OP([O-])([O-])=O)[C@@H](O)[C@H]1O"
  # Co-substrate (hydride DONOR) co-modelled in the active site so the catalytic-
  # power NAC screen (validation.md.reactive_geometry) can measure the formate ->
  # NADP-C4 hydride geometry. Drop this (and disable reactive_geometry) if you
  # only want the binding screen.
  extra_ligands:
    - id: formate
      type: smiles
      value: "[O-]C=O"
      role: substrate
  # [FILL-IN] from the AUTHORITATIVE numbering (UniProt/PDB/paper) FOR YOUR REAL
  # SEQUENCE. The placeholders below are deliberately wrong so doctor BLOCKs
  # until you set the real active-site/anchor residues.
  catalytic_residues: ["H999", "R999"]
  fixed_residues: ["H999", "R999"]
  cofactor: NADP
  ec_number: "1.2.1.2"

homologs:
  # No local DB: remote MSA (below) is used. To mine REAL homologs instead, set
  #   database: /mnt/data2/<you>/db/uniref30_2302/uniref30_2302_db
  # and remove msa.remote_server (or set it false).
  method: mmseqs2
  max_sequences: 20000

msa:
  method: mafft
  remote_server: true                   # real structural MSA via Boltz server; synthetic homolog features
  compute_conservation: true
  compute_pssm: true

complex_prediction:
  primary_method: boltz2
  use_msa_server: true                  # Boltz fetches a real MSA from its hosted server
  representative_homologs: 80
  diffusion_samples: 40                 # production ensemble (push higher for more pose variety)

interaction_model:
  enabled: true
  representative_homologs: 80
  poses_per_homolog: 15
  contact_cutoff: 6.0
  k_nearest_residues: 8
  model: xgboost

gnn:
  enabled: true                          # EvoLigand-GNN is the primary family model
  build_dataset: true
  checkpoint: checkpoints/evoligand_gnn.pt
  hidden_dim: 256
  layers: 6
  radius_lr: 6.0
  radius_rr: 9.0
  rbf: 16
  use_disorder: true
  lr: 0.001
  epochs: 60
  amp: true
  ddp: false                             # set true when launched via torchrun --nproc_per_node=4

mutation_generation:
  methods: [chemistry_rules, msa_sampler, ligandmpnn]
  max_candidates: 10000                  # large funnel; reranked down below
  design_radius_angstrom: 8.0

reranking:
  model: xgboost
  use_experimental_labels: false         # set true + experimental_dataset for a labelled rerank
  top_for_redocking: 600
  top_for_md: 40
  mutant_boltz_enabled: true             # per-mutant real Boltz so MD runs the actual mutant
  mutant_boltz_top_n: 40
  mutant_boltz_diffusion_samples: 5

validation:
  redocking:
    methods: [gnina, diffdock]
  stability:
    method: foldx
    max_ddg_allowed: 2.5
  md:
    enabled: true
    protocol_level: 2                    # 0 minimise-only | 1-2 lite | 3 full production_ns
    solvent: implicit
    production_ns: 2.0
    top_candidates: 40
    # Catalytic-power (near-attack-conformation) screen: REACTIVITY on top of the
    # binding-stability md_lite_score. Reports per-candidate NAC occupancy and
    # ΔNAC vs WT (mutant > WT == geometrically more productive active site).
    # Requires the hydride donor co-modelled (input.extra_ligands: formate).
    reactive_geometry:
      enabled: true
      donor_smarts: "[CX3H1](=O)[O-]"                  # formate C-H (hydride donor)
      acceptor_smarts: "[cH1]([cH0]C(=O)[NX3])[cH1]"   # nicotinamide C4
      donor_idx: 0
      acceptor_idx: 0
      transfer_is_h: true
      distance_max: 3.5      # Å, transferring H -> acceptor (hydride ~2.7-3.5)
      angle_min: 150.0       # deg, donor_heavy - H - acceptor (near-linear)
      label: formate_hydride_to_NADP_C4

scoring:
  gnn: 1.5                                # EvoLigand-GNN as a primary term
  family_interaction: 1.0

output:
  final_library_size: 192                # production plate (2x96); raise as needed
  top_single_mutants: 80
  report_format: [markdown, csv, pymol_session]

backend: real
backends: {}                             # e.g. {s10_md: mock} to defer MD during early stages
seed: 1234
