# E4a UMBRELLA / PMF ACCESS-BARRIER run (WT + lead + 1 control, explicit solvent, Mg-consistent).
# =====================================================================
# SrCAR (Carboxylic Acid Reductase, UniProt E5XP76) -> 3-HP adenylation, V5 — E4a tier.
# =====================================================================
# E2 found unbiased explicit MD never occupies the productive ~3 A O_nuc->Palpha window (the near-
# attack conformation is TRANSIENT, not a stable minimum). E4a asks the CORRECT question: the
# FREE-ENERGY COST to ACCESS the near-attack geometry, via umbrella sampling along O_nuc->Palpha +
# WHAM, under the SAME classical explicit FF. Driven by EVOLIEZ_E4A_UMBRELLA="dmin,dmax,n,k" (s10
# runs one biased MD per (candidate, window) -> umbrella_samples.json; analyse with
# scripts/e4a_umbrella_pmf.py). This config is IDENTICAL to the E1 explicit subset EXCEPT: its own
# output_dir, a short per-window production, and restrain_cosubstrate OFF (the umbrella harmonic IS
# the coordinate-controlling restraint; a separate flat-bottom retention at 3.6 A would FIGHT the
# umbrella for windows > 3.6 A and corrupt the PMF). The reactive ANGLE is NEVER biased.

project:
  name: srcar_3hp_v5
  objective: activity_improvement
  output_dir: /mnt/data/jglee/EvoLiEZ_car/runs/srcar_3hp_v5_e4a

input:
  target_id: srcar
  target_fasta: car/targets/srcar_Adomain.fasta   # E5XP76 residues 1-720 (A + PCP) — A-domain PRIMARY
  ligand:
    id: 3HP
    type: smiles
    value: "OCCC(=O)[O-]"           # 3-hydroxypropanoate
    role: design_ligand
    net_charge: -1
    allow_am1bcc: true
  extra_ligands:
    - id: ATP
      type: smiles
      value: "Nc1ncnc2n(cnc12)[C@@H]1O[C@H](COP(=O)([O-])OP(=O)([O-])OP(=O)([O-])[O-])[C@@H](O)[C@H]1O"
      role: cofactor                # adenylation co-substrate; the alpha-P is the electrophile
      net_charge: -4
      allow_am1bcc: false
      charges_mol2: params/atp_4minus/ATP.fixed.mol2   # pre-derived AM1-BCC (43 atoms, -4)
  catalytic_residues: ["S268", "T269", "K273"]
  fixed_residues: ["S268", "T269", "K273"]
  cofactor: ATP
  ec_number: "1.2.1.30"

mechanism:
  reaction:
    class: adenylation_phosphoryl_transfer
  reaction_state:
    substrate_state: 3HP_carboxylate
    cofactor_state: ATP
    metal_state: Mg2+_bridged        # bridges the 3-HP carboxylate and the ATP phosphates
    conformational_state: A_domain_closed
    protonation_model: pH7_4_manual

homologs:
  method: mmseqs2
  database: /mnt/data/jglee/evoliez_db/uniref30_2302_seqdb
  max_sequences: 20000

msa:
  method: mafft
  compute_conservation: true
  compute_pssm: true

complex_prediction:
  primary_method: boltz2
  use_msa_server: true
  representative_homologs: 80
  diffusion_samples: 25

interaction_model:
  enabled: true
  representative_homologs: 3              # minimal s06b (manifest-seeded, ml_score irrelevant)
  representative_coverage: 0.90
  representative_min: 40
  representative_max: 48
  poses_per_homolog: 12
  contact_cutoff: 6.0
  k_nearest_residues: 8
  model: xgboost

gnn:
  enabled: false

mutation_generation:
  methods: [chemistry_rules, msa_sampler, ligandmpnn]
  max_candidates: 8000
  design_radius_angstrom: 8.0

reranking:
  model: xgboost
  use_experimental_labels: false
  top_for_redocking: 400
  top_for_md: 4
  mutant_boltz_enabled: true
  mutant_boltz_top_n: 4
  mutant_boltz_diffusion_samples: 5

validation:
  redocking:
    methods: [gnina, diffdock]
  stability:
    method: thermompnn
    max_ddg_allowed: 2.5
  md:
    enabled: true
    engine: openmm
    protocol_level: 3               # explicit-solvent (multi-ligand build)
    solvent: explicit          # TIP3P + PME + Na/Cl neutralize
    production_ns: 0.04             # SHORT per umbrella window — the harmonic bias localizes sampling
    replicas: 1
    top_candidates: 4
    require_real_structure: true
    rbfe:
      enabled: false
    binding_dg:
      enabled: false
    # Umbrella access-barrier: the reactive O_nuc->Palpha DISTANCE is biased per window by the E4a
    # harmonic (added when EVOLIEZ_E4A_UMBRELLA is set); the ANGLE stays read-only. restrain_cosubstrate
    # is OFF here (the umbrella IS the coordinate restraint; a 3.6 A flat-bottom would fight it).
    reactive_geometry:
      enabled: true
      donor_smarts: "[OX1-]"                 # 3-HP carboxylate O (nucleophile)
      acceptor_smarts: "[PX4]([OX2][CX4])"   # ATP alpha-P only
      donor_idx: 0
      acceptor_idx: 0
      transfer_is_h: false                   # O attacks P -> leaving-group (O_nuc-Palpha-O_leaving) angle
      distance_max: 3.6
      angle_min: 150.0                       # read-only occupancy gate (no angle restraint)
      label: 3HP_carboxylate_to_ATP_alphaP
      template_cosubstrate_placement: true   # start each window from the productive ~3.2 A arrangement
      restrain_cosubstrate: false            # OFF — the umbrella harmonic controls the coordinate

scoring:
  family_interaction: 1.0

selection_lanes:
  enabled: true
  from_ml_high: 25
  from_stability_high: 12
  from_geometry_high: 12
  from_diversity: 8
  low_ml_controls: 8

compute:
  cpu_core_budget: 16
  gpu_pool: []
  fail_loud_on_cpu_md: true

output:
  final_library_size: 96
  top_single_mutants: 50
  report_format: [markdown, csv]

backend: real
backends: {}
allow_mock_fallback: false
seed: 1234
